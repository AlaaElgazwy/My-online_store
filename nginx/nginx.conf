# This file is used by the Nginx container to route traffic.
# يتم استخدام هذا الملف بواسطة حاوية Nginx لتوجيه حركة المرور.

upstream django_app {
    # Route traffic to the Django web service on port 8000
    # توجيه حركة المرور إلى خدمة الويب Django على المنفذ 8000
    server web:8000;
}

server {
    listen 80;

    # 1. Static Files Location (CRITICAL FOR CSS/JS)
    # موقع الملفات الثابتة (ضروري لملفات CSS/JS)
    # If the URL starts with /static/, Nginx serves the file directly from the volume.
    # إذا بدأ الرابط بـ /static/، سيقوم Nginx بخدمة الملف مباشرة من مجلد التخزين المشترك.
    location /static/ {
        # The alias path must match the volume mount path in the web container's STATIC_ROOT
        # يجب أن يتطابق مسار التسمية المستعارة مع مسار مجلد STATIC_ROOT في حاوية الويب
        alias /app/staticfiles/;
    }

   

    # 2. Media Files Location (User Uploads)
    # موقع ملفات الوسائط (تحميلات المستخدم)
    # If the URL starts with /media/, Nginx serves the file directly from the volume.
    # إذا بدأ الرابط بـ /media/، سيقوم Nginx بخدمة الملف مباشرة من مجلد التخزين المشترك.
    location /media/ {
       alias  /usr/share/nginx/html/media/;
    }

    # 3. All other traffic is proxied to Gunicorn/Django
    # جميع حركة المرور الأخرى يتم تمريرها إلى Gunicorn/Django
    location / {
        proxy_pass http://django_app;
        
        # Pass the original Host header (IMPORTANT for Django security)
        proxy_set_header Host $host; 
        
        # Pass the protocol (http or https) which is crucial for secure cookies and CSRF
        proxy_set_header X-Forwarded-Proto $scheme; # <--- تم إضافة هذا الرأس الهام
        
        # Pass the user's real IP address
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}